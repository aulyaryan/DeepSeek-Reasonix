name: Build Desktop (Fork)

on:
  workflow_dispatch:
  push:
    branches: [main-v2]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows/amd64
            name: windows-amd64
          - runner: ubuntu-22.04
            platform: linux/amd64
            name: linux-amd64
          - runner: macos-14
            platform: darwin/universal
            name: darwin-universal
    runs-on: ${{ runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # Linux deps
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
      # Windows deps
      - name: Windows deps
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      # macOS signing bypass
      - name: macOS ad-hoc sign
        if: runner.os == 'macOS'
        run: echo "DESKTOP_BUILD_SKIP_DMG=1" >> "$GITHUB_ENV"

      - name: Build desktop
        env:
          VERSION: dev-${{ github.run_number }}
        run: |
          scripts/desktop-build.sh "${{ matrix.platform }}" "$VERSION" "canary"

      - uses: actions/upload-artifact@v7
        with:
          name: reasonix-desktop-${{ matrix.name }}
          path: dist/*
