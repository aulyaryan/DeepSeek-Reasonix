name: Release Desktop Fork

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. desktop-v1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin/universal
            name: darwin-universal
          - runner: windows-latest
            platform: windows/amd64
            name: windows-amd64
          - runner: ubuntu-22.04
            platform: linux/amd64
            name: linux-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # ── Linux deps ──
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # ── Windows deps ──
      - name: Windows deps
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      # ── macOS ad-hoc sign ──
      - name: macOS ad-hoc sign
        if: runner.os == 'macOS'
        run: echo "DESKTOP_BUILD_SKIP_DMG=1" >> "$GITHUB_ENV"

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#desktop-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          scripts/desktop-build.sh "${{ matrix.platform }}" "$VERSION" "stable"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish Release
    needs: desktop
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: desktop-*
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List assets
        run: ls -lah assets/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Creating release: $TAG"

          gh release create "$TAG" \
            --title "Reasonix Desktop $TAG" \
            --generate-notes \
            --repo "${{ github.repository }}" || true

          gh release upload "$TAG" assets/* \
            --clobber \
            --repo "${{ github.repository }}"
